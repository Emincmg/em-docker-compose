services:
  # Laravel app service (PHP-FPM)
  laravel-app:
    build:
      args:
        user: laravel
        uid: 1000
      context: ./laravel-app #change this to your laravel root folder
      dockerfile: Dockerfile
    working_dir: /var/www/html
    image: laravel-app
    container_name: laravel-app
    restart: unless-stopped
    tty: true
    env_file:
      - ./laravel-app/.env
    depends_on:
      - mysql
    networks:
      - app-network
        
  # .NET Core app service
  dotnet-app:
    build:
      context: ./dotnet-core-app
      dockerfile: Dockerfile
    working_dir: /var/www/html
    image: dotnet-core-app
    container_name: dotnet-core-app
    restart: unless-stopped
    depends_on:
      - sqlserver
    ports:
      - "5000:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
    networks:
      - app-network
        

  # Frontend app service (Vue-Nuxt SSR config, unsafe for sensitive data. Use backend instead)
  vue-app:
    ports:
      - "3001:3001"
    user: node
    build:
      context: ./vue-app
      dockerfile: Dockerfile
    working_dir: /var/www/html
    volumes:
      - ./vue-app:/var/www/html
    container_name: vue-app
    command: ["node", ".output/server/index.mjs"]
    stdin_open: true
    tty: true
    networks:
      - app-network

  # NGINX Web Server
  nginx:
    image: nginx:1.25
    working_dir: /var/www/html
    container_name: nginx-webserver
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./laravel-app/public:/var/www/html/laravel/public:ro
      - ./vue-app:/var/www/html/vue
      - ./dotnet-core-app:/var/www/html/dotnet:ro
      - ./nginx/laravel/default.conf:/etc/nginx/conf.d/laravel.conf
      - ./nginx/dotnet/default.conf:/etc/nginx/conf.d/dotnet.conf
      - ./nginx/vue/default.conf:/etc/nginx/conf.d/vue.conf
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    networks:
      - app-network

  # MySQL Database
  mysql:
    image: mysql:5.7
    container_name: mysql
    restart: unless-stopped
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_ROOT_HOST: '%'
      MYSQL_ROOT_PASSWORD: SafePassword # change this to any safe password
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - app-network

# MSSQL Server
  sqlserver:
      image: mcr.microsoft.com/mssql/server:2022-CU18-ubuntu-22.04
      environment:
        MSSQL_SA_PASSWORD: "LocalDev2025"
        ACCEPT_EULA: "Y"
        MSSQL_PID: "Developer"
      volumes:
        - sqlserver-data:/var/opt/mssql
      ports:
        - "1433:1433"
      restart: unless-stopped
      networks:
        - app-network
      
  # Certbot container for auto-generating certificates.
  certbot:
    image: certbot/certbot
    container_name: certbot
    restart: always
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'"
    networks:
      - app-network
networks:
  app-network:
    driver: bridge
volumes:
  mysql-data:
    driver: local
  sqlserver-data:
      driver: local
