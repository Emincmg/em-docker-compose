server {
    listen 80;
    server_name dotnetappdomain.com;

    location /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name dotnetappdomain.com;

    ssl_certificate /etc/letsencrypt/live/dotnetappdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dotnetappdomain.com/privkey.pem;

    location / {
        proxy_pass http://dotnet-app:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection keep-alive;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}
